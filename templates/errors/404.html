{% extends 'base.html' %}

{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="center" style="padding: var(--space-6) 0;">
    <p style="font-size: 4rem; font-weight: 700; color: var(--color-line); margin-bottom: var(--space-2);">404</p>
    <h1 style="font-size: var(--text-lg); margin-bottom: var(--space-2);">Page Not Found</h1>
    <p class="muted" style="margin-bottom: var(--space-4);">
        The page you're looking for doesn't exist or may have been moved.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Back to Home</a>
</div>
{% endblock %}
