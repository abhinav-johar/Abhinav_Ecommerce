{% extends 'base.html' %}

{% block title %}Something Went Wrong{% endblock %}

{% block content %}
<div class="center" style="padding: var(--space-6) 0;">
    <p style="font-size: 4rem; font-weight: 700; color: var(--color-line); margin-bottom: var(--space-2);">500</p>
    <h1 style="font-size: var(--text-lg); margin-bottom: var(--space-2);">Something Went Wrong</h1>
    <p class="muted" style="margin-bottom: var(--space-4);">
        An unexpected error occurred on our end. Please try again in a moment.
    </p>
    <a href="{{ url_for('main.index') }}" class="btn btn-primary">Back to Home</a>
</div>
{% endblock %}
