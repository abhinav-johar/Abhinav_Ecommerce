{% extends 'base.html' %}

{% block title %}My Profile{% endblock %}

{% block content %}
<h1 style="font-size: var(--text-lg); margin-bottom: var(--space-4);">My Profile</h1>

<div style="max-width: 480px;">
    <div style="border:1px solid var(--color-line); border-radius:4px; padding: var(--space-4); margin-bottom: var(--space-4);">
        <p style="margin-bottom: var(--space-2);"><strong>Name:</strong> {{ user.name }}</p>
        <p style="margin-bottom: var(--space-2);"><strong>Email:</strong> {{ user.email }}</p>
        <p style="margin-bottom: var(--space-2);"><strong>Phone:</strong> {{ user.phone or 'Not provided' }}</p>
        <p><strong>Member since:</strong> {{ user.created_at.strftime('%B %Y') }}</p>
    </div>

    <div style="display:flex; gap: var(--space-2);">
        <a href="{{ url_for('auth.addresses') }}" class="btn btn-outline">Manage Addresses</a>
        <a href="{{ url_for('orders.order_history') }}" class="btn btn-outline">My Orders</a>
    </div>
</div>
{% endblock %}
